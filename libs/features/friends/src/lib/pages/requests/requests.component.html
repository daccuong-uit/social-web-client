<div class="page-content">
  <h1 class="page-title">Lời mời kết bạn</h1>
  <p class="page-subtitle">{{ users().length }} lời mời đang chờ</p>

  <div class="card-grid">
    @for (user of users(); track user.id) {
      <fe-friend-card variant="avatar-card" [user]="user" [context]="'requests'" (actionRequested)="onAction($event)" (menuItemClick)="onMenuItemClick($event, user)"></fe-friend-card>
    }
  </div>
</div>
