<div class="reels-page">

  <!-- ═══ VIDEO AREA (center column) ═══ -->
  <div class="reels-center">

    <!-- Viewport for sliding animation -->
    <div class="reels-viewport" style="height: 90vh; overflow: hidden; position: relative; width: 100%; max-width: max-content; display: flex; justify-content: center;">
      <div class="reels-slider" [style.transform]="'translateY(calc(-' + reelsService.currentIndex() + ' * 90vh))'"
        style="transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); display: flex; flex-direction: column; height: 100%; max-width: 100%;">

        <!-- Video + side icons wrapper (centered together) -->
        <div class="reels-content-wrapper" *ngFor="let reel of reelsService.reels(); let i = index; trackBy: trackReel"
          style="height: 90vh; flex-shrink: 0; max-width: 100%;">


          <!-- Video card Component -->
          <fe-reel-item 
            [reel]="reel" 
            [isCurrent]="i === reelsService.currentIndex()"
            (onLike)="reelsService.currentIndex() === i && reelsService.toggleLike()"
            style="flex: 1 1 auto; min-width: 0; display: flex; justify-content: center;">
          </fe-reel-item>

          <!-- ═══ ACTION ICONS COLUMN ═══ -->
          <div class="reels-actions">

            <!-- Like -->
            <button class="action-btn" [class.active]="reel.liked"
              (click)="reelsService.currentIndex() === i && reelsService.toggleLike()" id="reel-like-btn"
              aria-label="Thích">
              <div class="action-icon-wrap">
                <svg viewBox="0 0 24 24" [attr.fill]="reel.liked ? 'currentColor' : 'none'" stroke="currentColor"
                  stroke-width="2">
                  <path
                    d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
              </div>
              <span class="action-count">{{ formatCount(reel.likes) }}</span>
            </button>

            <!-- Comment -->
            <button class="action-btn" [class.active]="reelsService.currentIndex() === i && reelsService.showComments()"
              (click)="reelsService.currentIndex() === i && reelsService.toggleComments()" id="reel-comment-btn"
              aria-label="Bình luận">
              <div class="action-icon-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
              </div>
              <span class="action-count">{{ formatCount(reel.comments) }}</span>
            </button>

            <!-- Share -->
            <button class="action-btn" id="reel-share-btn" aria-label="Chia sẻ">
              <div class="action-icon-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" />
                  <polyline points="16 6 12 2 8 6" />
                  <line x1="12" y1="2" x2="12" y2="15" />
                </svg>
              </div>
              <span class="action-count">{{ formatCount(reel.shares) }}</span>
            </button>

            <!-- Save / Bookmark -->
            <button class="action-btn" [class.active]="reel.saved"
              (click)="reelsService.currentIndex() === i && reelsService.toggleSave()" id="reel-save-btn"
              aria-label="Lưu">
              <div class="action-icon-wrap">
                <svg viewBox="0 0 24 24" [attr.fill]="reel.saved ? 'currentColor' : 'none'" stroke="currentColor"
                  stroke-width="2">
                  <path d="M6 3h12a2 2 0 0 1 2 2v16l-8-5-8 5V5a2 2 0 0 1 2-2Z" />
                </svg>
              </div>
              <span class="action-count">{{ formatCount(reel.saves) }}</span>
            </button>

            <!-- More options -->
            <button class="action-btn" id="reel-more-btn" aria-label="Thêm">
              <div class="action-icon-wrap">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <circle cx="12" cy="5" r="1.5" />
                  <circle cx="12" cy="12" r="1.5" />
                  <circle cx="12" cy="19" r="1.5" />
                </svg>
              </div>
            </button>

            <!-- Divider -->
            <div class="actions-divider"></div>

            <!-- Prev / Next navigation -->
            <button class="action-btn nav-btn" [class.disabled]="reelsService.currentIndex() === 0"
              (click)="reelsService.currentIndex() === i && reelsService.goToPrev()" id="reel-prev-btn"
              aria-label="Reel trước">
              <div class="action-icon-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                  <polyline points="18 15 12 9 6 15" />
                </svg>
              </div>
            </button>

            <button class="action-btn nav-btn"
              [class.disabled]="reelsService.currentIndex() === reelsService.reels().length - 1"
              (click)="reelsService.currentIndex() === i && reelsService.goToNext()" id="reel-next-btn"
              aria-label="Reel tiếp">
              <div class="action-icon-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                  <polyline points="6 9 12 15 18 9" />
                </svg>
              </div>
            </button>

          </div>
          <!-- end .reels-actions -->

        </div>
        <!-- end .reels-content-wrapper (ngFor) -->

      </div>
      <!-- end .reels-slider -->
    </div>
    <!-- end .reels-viewport -->

    <!-- Mobile Comments Panel (Bottom Sheet) -->
    <ng-container *ngIf="reelsService.showComments()">
      <fe-reels-comments class="mobile-comments bottom-sheet"></fe-reels-comments>
    </ng-container>

  </div>
  <!-- end .reels-center -->

</div>
