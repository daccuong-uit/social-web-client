<div class="sidebar-right">
  <div class="sidebar-scroll-container">
    <div class="sidebar-content">

      <!-- Profile Card (always visible) -->
      <section class="profile-card">
        <div class="profile-top">
          <div class="profile-avatar"
            [style.background-image]="'url(https://ui-avatars.com/api/?name=' + (user()?.displayName || user()?.username || 'User') + '&background=0D8ABC&color=fff)'"
            style="background-size: cover;">
          </div>

          <div class="profile-info">
            <p class="profile-name">
              {{ user()?.displayName || 'Người dùng' }}
            </p>
            <p class="profile-handle">
              {{ user()?.username ? '@' + user()?.username : '@user' }}
            </p>
          </div>

          <div class="profile-menu-btn" (click)="toggleMenu($event)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <circle cx="12" cy="12" r="1"></circle>
              <circle cx="12" cy="5" r="1"></circle>
              <circle cx="12" cy="19" r="1"></circle>
            </svg>
          </div>

          <div *ngIf="showMenu()" class="profile-menu-dropdown" #menuDropdown>
            <a routerLink="/profile" class="dropdown-item" (click)="closeMenu()">
              Xem Profile
            </a>
            <a class="dropdown-item dropdown-logout" (click)="logout()">
              Đăng xuất
            </a>
          </div>
        </div>

        <ng-container>
          <div class="profile-actions">
            <button class="btn btn-outline" style="padding: 0; width: 100%;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
              </svg>
            </button>

            <button class="btn btn-outline" style="padding: 0; width: 100%;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
            </button>

            <button class="btn btn-primary" routerLink="/media/studio">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <polygon points="23 7 16 12 23 17 23 7"></polygon>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
              </svg>
              Studio
            </button>
          </div>
        </ng-container>
      </section>

      <!-- Full-featured Comments Panel (conditionally visible) -->
      <ng-container *ngIf="reelsService.showComments()">
        <fe-reels-comments class="desktop-comments"></fe-reels-comments>
      </ng-container>

      <!-- Placeholder when comments not open -->
      <ng-container *ngIf="!reelsService.showComments()">
        <div class="comments-empty fade-in" style="margin-top: 24px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <p>Nhấn vào biểu tượng bình luận để xem.</p>
        </div>
      </ng-container>

    </div>
  </div>
</div>
