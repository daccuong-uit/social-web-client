<section class="current-user-card">
  <div class="current-user-card__top">
    <div
      class="current-user-card__avatar"
      [style.background-image]="'url(https://ui-avatars.com/api/?name=' + (user()?.displayName || user()?.username || 'User') + '&background=0D8ABC&color=fff)'">
    </div>

    <div class="current-user-card__identity">
      <p class="current-user-card__name">{{ user()?.displayName || 'Người dùng' }}</p>
      <p class="current-user-card__handle">{{ user()?.username ? '@' + user()?.username : '@user' }}</p>
    </div>

    <button
      type="button"
      class="current-user-card__menu"
      aria-label="Mở menu tài khoản"
      (click)="toggleMenu($event)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="5" r="1"></circle>
        <circle cx="12" cy="12" r="1"></circle>
        <circle cx="12" cy="19" r="1"></circle>
      </svg>
    </button>

    @if (showMenu()) {
      <div class="current-user-card__dropdown">
        <a routerLink="/profile" (click)="closeMenu()">Xem Profile</a>
        <button type="button" (click)="logout()">Đăng xuất</button>
      </div>
    }
  </div>

  @if (showActions) {
    <div class="current-user-card__actions">
      <button type="button" class="btn btn-outline" aria-label="Thông báo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </button>
      <button type="button" class="btn btn-outline" aria-label="Tin nhắn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
      </button>
      <button type="button" class="btn btn-primary" routerLink="/media/studio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2"></rect>
        </svg>
        Studio
      </button>
    </div>
  }
</section>
